backend:
  name: git-gateway
  branch: main

media_folder: "assets/images/uploads"
public_folder: "/assets/images/uploads"

collections:
  - name: "reviews"
    label: "Client Reviews"
    label_singular: "Client Review"
    folder: "content/reviews"
    create: true
    identifier_field: "title"
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{author}} - {{placement}} - {{source}}"
    editor:
      preview: false
    fields:
      - label: "Published"
        name: "published"
        widget: "hidden"
        default: true

      - label: "Review File Name"
        name: "title"
        widget: "string"
        hint: "Use a short unique name for the file, like Juan Hernandez or Christine Cisco. Do not paste the full review here."

      - label: "Reviewer Name"
        name: "author"
        widget: "string"
        hint: "Enter the client name exactly as it should appear on the website."

      - label: "Review Text"
        name: "body"
        widget: "text"
        hint: "Paste only the review wording. Quotation marks are added on the website."

      - label: "Transaction Details"
        name: "detail"
        widget: "string"
        required: false
        hint: "Example: Bought a Single Family Home · Modesto, CA · April 2025"

      - label: "Where Was This Review Posted?"
        name: "source"
        widget: "select"
        default: "Zillow"
        options:
          - label: "Zillow"
            value: "Zillow"
          - label: "Google"
            value: "Google"
          - label: "Socials"
            value: "Socials"
          - label: "Instagram"
            value: "Instagram"
          - label: "Facebook"
            value: "Facebook"
          - label: "Other"
            value: "Other"

      - label: "Show Review In"
        name: "placement"
        widget: "select"
        default: "more"
        options:
          - label: "Featured Reviews (top cards)"
            value: "featured"
          - label: "More Reviews (all review cards)"
            value: "more"
        hint: "Choose Featured only for reviews you want highlighted at the top of the Reviews page."

      - label: "Display Order"
        name: "order"
        widget: "number"
        default: 10
        value_type: "int"
        min: 1
        hint: "Smaller numbers display first within the selected section."

      - label: "Star Rating"
        name: "rating"
        widget: "select"
        default: 5
        options:
          - label: "5 Stars"
            value: 5
          - label: "4 Stars"
            value: 4
          - label: "3 Stars"
            value: 3
          - label: "2 Stars"
            value: 2
          - label: "1 Star"
            value: 1

  - name: "blog"
    label: "Blog Posts"
    label_singular: "Blog Post"
    folder: "content/blog"
    filter:
      field: "published"
      value: true
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    summary: "{{title}}"
    editor:
      preview: true
    fields:
      - label: "Published"
        name: "published"
        widget: "hidden"
        default: true

      - label: "Title"
        name: "title"
        widget: "string"

      - label: "When should this post go live?"
        name: "publishTiming"
        widget: "select"
        default: "now"
        hint: "Times are always California / Pacific Time."
        options:
          - label: "Schedule now / today"
            value: "now"
          - label: "Schedule for a different date and time"
            value: "future"

      - label: "Scheduled Date"
        name: "scheduleDate"
        widget: "datetime"
        format: "YYYY-MM-DD"
        date_format: "YYYY-MM-DD"
        time_format: false
        required: false
        hint: "Only use this when scheduling for a different day. California / Pacific Time."
        condition:
          field: "publishTiming"
          value: "future"

      - label: "Scheduled Time"
        name: "scheduleHour"
        widget: "select"
        default: "09:00"
        required: false
        hint: "Hour-only increments, always California / Pacific Time."
        condition:
          field: "publishTiming"
          value: "future"
        options:
          - label: "12:00 AM PT"
            value: "00:00"
          - label: "1:00 AM PT"
            value: "01:00"
          - label: "2:00 AM PT"
            value: "02:00"
          - label: "3:00 AM PT"
            value: "03:00"
          - label: "4:00 AM PT"
            value: "04:00"
          - label: "5:00 AM PT"
            value: "05:00"
          - label: "6:00 AM PT"
            value: "06:00"
          - label: "7:00 AM PT"
            value: "07:00"
          - label: "8:00 AM PT"
            value: "08:00"
          - label: "9:00 AM PT"
            value: "09:00"
          - label: "10:00 AM PT"
            value: "10:00"
          - label: "11:00 AM PT"
            value: "11:00"
          - label: "12:00 PM PT"
            value: "12:00"
          - label: "1:00 PM PT"
            value: "13:00"
          - label: "2:00 PM PT"
            value: "14:00"
          - label: "3:00 PM PT"
            value: "15:00"
          - label: "4:00 PM PT"
            value: "16:00"
          - label: "5:00 PM PT"
            value: "17:00"
          - label: "6:00 PM PT"
            value: "18:00"
          - label: "7:00 PM PT"
            value: "19:00"
          - label: "8:00 PM PT"
            value: "20:00"
          - label: "9:00 PM PT"
            value: "21:00"
          - label: "10:00 PM PT"
            value: "22:00"
          - label: "11:00 PM PT"
            value: "23:00"

      - label: "Schedule Timezone"
        name: "scheduleTimezone"
        widget: "hidden"
        default: "America/Los_Angeles"

      - label: "Read Time"
        name: "readTime"
        widget: "select"
        options:
          - label: "3 Min Read"
            value: "3 Min Read"
          - label: "5 Min Read"
            value: "5 Min Read"
          - label: "7 Min Read"
            value: "7 Min Read"
          - label: "10 Min Read"
            value: "10 Min Read"

      - label: "Category"
        name: "category"
        widget: "select"
        options:
          - label: "MARKET UPDATES"
            value: "Market Updates"
          - label: "BUYER TIPS"
            value: "Buyer Tips"
          - label: "SELLER TIPS"
            value: "Seller Tips"
          - label: "FIRST-TIME BUYERS"
            value: "First-Time Buyers"
          - label: "INVESTMENT"
            value: "Investment"
          - label: "LOCAL SPOTLIGHT"
            value: "Local Spotlight"

      - label: "Excerpt"
        name: "excerpt"
        widget: "text"
        required: false

      - label: "Featured Image"
        name: "featuredImage"
        widget: "image"
        required: false

      - label: "Image Alt Text"
        name: "imageAlt"
        widget: "string"
        required: false

      - label: "Featured Blog"
        name: "featured"
        widget: "boolean"
        default: false
        true_label: "Featured"
        false_label: "Not Featured"
        hint: "If multiple posts are marked featured, the most recently changed one wins and the site only shows one."

      - label: "Body"
        name: "body"
        widget: "markdown"
        required: false
        buttons:
          - bold
          - italic
          - code
          - link
          - heading-two
          - heading-three
          - bulleted-list
          - numbered-list
          - quote
        editor_components:
          - image
        modes:
          - rich_text
          - raw
