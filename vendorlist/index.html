  <style>
    :root {
      --vendor-black: #050505;
      --vendor-tan: #c9ad99;
      --vendor-cream: #f8f3ed;
      --vendor-white: #ffffff;
      --vendor-text: #765f50;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      overflow-x: hidden;
      background: var(--vendor-cream);
      color: var(--vendor-black);
      font-family: "Jost", sans-serif;
    }

    .vendor-hero {
      padding: clamp(64px, 8vw, 112px) clamp(20px, 6vw, 88px);
      background: var(--vendor-black);
      color: var(--vendor-white);
      text-align: center;
    }

    .vendor-hero__inner {
      width: min(900px, 100%);
      margin: 0 auto;
    }

    .vendor-eyebrow {
      margin: 0 0 18px;
      color: var(--vendor-tan);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.22em;
      text-transform: uppercase;
    }

    .vendor-hero h1 {
      margin: 0;
      font-family: "Cormorant Garamond", serif;
      font-size: clamp(46px, 7vw, 78px);
      font-weight: 300;
      line-height: 1;
    }

    .vendor-hero h1 em {
      color: var(--vendor-tan);
      font-weight: 300;
    }

    .vendor-intro {
      max-width: 690px;
      margin: 24px auto 0;
      color: rgba(255, 255, 255, 0.72);
      font-size: 15px;
      font-weight: 300;
      line-height: 1.8;
    }

    .vendor-open-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 48px;
      margin-top: 30px;
      padding: 13px 26px;
      border: 1px solid var(--vendor-tan);
      background: var(--vendor-tan);
      color: var(--vendor-black);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 180ms ease, color 180ms ease;
    }

    .vendor-open-link:hover,
    .vendor-open-link:focus-visible {
      background: transparent;
      color: var(--vendor-white);
    }

    .vendor-directory {
      padding: clamp(30px, 5vw, 64px) clamp(14px, 4vw, 64px) clamp(56px, 7vw, 96px);
      background: var(--vendor-cream);
    }

    .vendor-frame-shell {
      width: min(1400px, 100%);
      margin: 0 auto;
      overflow: hidden;
      border: 1px solid rgba(118, 95, 80, 0.25);
      background: var(--vendor-white);
      box-shadow: 0 18px 55px rgba(54, 39, 30, 0.12);
    }

    .vendor-frame {
      display: block;
      width: 100%;
      height: min(82vh, 980px);
      min-height: 760px;
      border: 0;
      background: var(--vendor-white);
    }

    .vendor-frame-fallback {
      padding: 28px;
      color: var(--vendor-text);
      text-align: center;
    }

    .vendor-frame-fallback a { color: var(--vendor-text); }

    @media (max-width: 700px) {
      .vendor-hero { padding: 58px 22px; }
      .vendor-intro { font-size: 14px; }
      .vendor-directory { padding: 20px 0 48px; }
      .vendor-frame-shell { border-right: 0; border-left: 0; box-shadow: none; }
      .vendor-frame { height: 78vh; min-height: 650px; }
    }
  </style>

  <main>

      <div class="vendor-hero__inner">
        <p class="vendor-eyebrow">Local Resources</p>
        <h1 id="vendor-page-title">Our Trusted <em>Vendor List</em></h1>
        <p class="vendor-intro">Find local professionals and home-service resources collected by Taylor Thompson Home Group for Central Valley clients.</p>
        <a class="vendor-open-link" href="https://app.highnote.io/c/p/b0f87e71/taylor-thompson-home-group-vendor-list?cp=link" target="_blank" rel="noopener noreferrer">Open Vendor List Full Screen</a>

        <iframe
          class="vendor-frame"
          src="https://app.highnote.io/c/p/b0f87e71/taylor-thompson-home-group-vendor-list?cp=link"
          title="Taylor Thompson Home Group vendor list"
          loading="eager"
          referrerpolicy="strict-origin-when-cross-origin"
          allow="clipboard-write; fullscreen"
        >
          <p class="vendor-frame-fallback">The vendor list is loading. You can also <a href="https://app.highnote.io/c/p/b0f87e71/taylor-thompson-home-group-vendor-list?cp=link">open the complete vendor list here</a>.</p>
        </iframe>
      </div>
