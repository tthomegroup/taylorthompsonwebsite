<!doctype html>
<html lang="en">
<head>

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&family=Jost:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Blog | Taylor Thompson Home Group</title>
  <link rel="icon" href="/assets/images/favicon.png" type="image/png">
  <style>
    :root {
      --bg: #f7f2ed;
      --ink: #050505;
      --muted: #765f50;
      --tan: #c8ad9a;
      --line: #d9cec5;
      --white: #fff;
      --cream: #faf6f1;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      background: var(--cream);
      color: var(--ink);
      font-family: 'Jost', sans-serif;
      line-height: 1.65;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a { color: inherit; }

    .blog-page {
      width: min(1120px, calc(100% - 40px));
      margin: 0 auto;
      padding: 56px 0 84px;
    }

    .page-title {
      margin: 0 0 34px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(44px, 7vw, 76px);
      font-weight: 400;
      line-height: 1;
    }

    .page-title em {
      color: var(--tan);
      font-style: italic;
    }

    .featured {
      display: none;
      grid-template-columns: minmax(0, 1fr) minmax(300px, 0.9fr);
      gap: clamp(36px, 5vw, 64px);
      align-items: center;
      padding: 36px 0 72px;
      border-bottom: 1px solid var(--line);
      margin-bottom: 38px;
    }

    .featured.is-visible { display: grid; }

    .featured img {
      width: 100%;
      aspect-ratio: 16 / 9;
      object-fit: cover;
      background: var(--tan);
    }

    .eyebrow,
    .meta,
    .card-category {
      color: var(--tan);
      font-size: 12px;
      font-weight: 800;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .featured h2 {
      margin: 12px 0 22px;
      font-family: 'Cormorant Garamond', serif;
      font-size: clamp(38px, 5vw, 58px);
      font-weight: 400;
      line-height: 1.12;
    }

    .featured-excerpt {
      margin: 0 0 24px;
      color: var(--muted);
    }

    .meta {
      display: flex;
      flex-wrap: wrap;
      gap: 18px 28px;
      margin-bottom: 24px;
    }

    .button {
      display: inline-block;
      border: 0;
      background: #765f50;
      color: #fff;
      padding: 14px 28px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-decoration: none;
      text-transform: uppercase;
      cursor: pointer;
    }

    .blog-tools {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 190px;
      gap: 12px;
      margin-bottom: 14px;
    }

    .blog-tools input,
    .blog-tools select {
      width: 100%;
      border: 1px solid #cfc7bf;
      background: #fff;
      color: var(--ink);
      min-height: 48px;
      padding: 0 14px;
      font: inherit;
      font-size: 13px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 0 0 28px;
    }

    .filter {
      border: 1px solid #cfc7bf;
      background: transparent;
      min-height: 38px;
      padding: 0 16px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .filter.active {
      background: #000;
      border-color: #000;
      color: #fff;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 24px;
    }

    .pagination {
      display: none;
      align-items: center;
      justify-content: center;
      gap: 18px;
      margin-top: 42px;
    }

    .pagination.is-visible { display: flex; }

    .page-arrow {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 52px;
      height: 52px;
      border: 1px solid var(--ink);
      background: transparent;
      color: var(--ink);
      font-size: 26px;
      line-height: 1;
      cursor: pointer;
      transition: background 0.2s ease, color 0.2s ease, opacity 0.2s ease;
    }

    .page-arrow:hover:not(:disabled),
    .page-arrow:focus-visible:not(:disabled) {
      background: var(--ink);
      color: var(--white);
    }

    .page-arrow:disabled {
      cursor: default;
      opacity: 0.3;
    }

    .page-status {
      min-width: 92px;
      color: var(--muted);
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.16em;
      text-align: center;
      text-transform: uppercase;
    }

    .card {
      display: flex;
      min-height: 100%;
      background: var(--white);
      flex-direction: column;
    }

    .card img {
      width: 100%;
      aspect-ratio: 4 / 3;
      object-fit: cover;
      background: var(--tan);
    }

    .card-body {
      display: flex;
      flex: 1;
      flex-direction: column;
      padding: 26px 24px 28px;
    }

    .card h3 {
      margin: 18px 0 14px;
      font-family: 'Cormorant Garamond', serif;
      font-size: 25px;
      font-weight: 400;
      line-height: 1.2;
    }

    .card p {
      margin: 0 0 26px;
      color: var(--muted);
      font-size: 14px;
    }

    .card .button {
      margin-top: auto;
      align-self: flex-start;
      padding: 12px 22px;
    }

    .empty {
      display: none;
      padding: 40px;
      border: 1px solid var(--line);
      background: var(--white);
      color: var(--muted);
    }

    .empty.is-visible { display: block; }

    @media (max-width: 900px) {
      .featured,
      .grid,
      .blog-tools {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 760px) {
      body {
        overflow-x: hidden;
      }

      .blog-page {
        width: min(100% - 32px, 560px);
        padding: 36px 0 58px;
      }

      .page-title {
        margin-bottom: 22px;
        font-size: clamp(42px, 15vw, 58px);
      }

      .featured {
        gap: 22px;
        padding: 18px 0 38px;
        margin-bottom: 28px;
      }

      .featured img {
        aspect-ratio: 4 / 3;
      }

      .featured h2 {
        margin: 10px 0 16px;
        font-size: clamp(32px, 10vw, 42px);
      }

      .featured-excerpt {
        margin-bottom: 18px;
        font-size: 14px;
        line-height: 1.65;
      }

      .meta {
        gap: 8px 16px;
        margin-bottom: 18px;
        font-size: 10px;
        letter-spacing: 0.12em;
      }

      .blog-tools {
        grid-template-columns: 1fr;
        gap: 10px;
      }

      .blog-tools input,
      .blog-tools select {
        min-height: 52px;
        font-size: 16px;
      }

      .filters {
        display: flex;
        flex-wrap: nowrap;
        gap: 8px;
        margin: 0 -16px 24px;
        padding: 0 16px 8px;
        overflow-x: auto;
        -webkit-overflow-scrolling: touch;
        scrollbar-width: none;
      }

      .filters::-webkit-scrollbar {
        display: none;
      }

      .filter {
        flex: 0 0 auto;
        min-height: 40px;
        padding: 0 14px;
        font-size: 10px;
        letter-spacing: 0.1em;
        white-space: nowrap;
      }

      .grid {
        grid-template-columns: 1fr;
        gap: 18px;
      }

      .card img {
        aspect-ratio: 16 / 10;
      }

      .card-body {
        padding: 22px 20px 24px;
      }

      .card h3 {
        margin: 14px 0 12px;
        font-size: 29px;
        line-height: 1.12;
      }

      .card p {
        margin-bottom: 22px;
        font-size: 14px;
        line-height: 1.65;
      }

      .button,
      .card .button {
        width: 100%;
        padding: 13px 18px;
        text-align: center;
      }

      .pagination {
        gap: 12px;
        margin-top: 30px;
      }

      .page-arrow {
        width: 46px;
        height: 46px;
      }

      .page-status {
        min-width: 84px;
        font-size: 10px;
        letter-spacing: 0.12em;
      }

      .empty {
        padding: 26px 20px;
      }
    }

    @media (max-width: 420px) {
      .blog-page {
        width: calc(100% - 28px);
      }

      .featured {
        padding-top: 10px;
      }

      .card h3 {
        font-size: 27px;
      }
    }
  </style>

</head>
<body>
  <noscript><img height="1" width="1" style="display:none"
src="https://www.facebook.com/tr?id=4531065853843983&ev=PageView&noscript=1"
/></noscript>
  <div data-include="/includes/header.html"></div>
  <main class="blog-page">
    <section class="featured" id="featured-blog" aria-label="Featured blog"></section>

    <header>
      <h1 class="page-title">Latest <em>Blogs</em></h1>
    </header>

    <div class="blog-tools">
      <input id="blog-search" type="search" placeholder="Search blog keywords">
      <select id="blog-sort" aria-label="Sort blog posts">
        <option value="newest">Newest First</option>
        <option value="oldest">Oldest First</option>
      </select>
    </div>

    <nav class="filters" aria-label="Blog categories">
      <button class="filter active" type="button" data-category="ALL">All</button>
      <button class="filter" type="button" data-category="Market Updates">Market Updates</button>
      <button class="filter" type="button" data-category="Buyer Tips">Buyer Tips</button>
      <button class="filter" type="button" data-category="Seller Tips">Seller Tips</button>
      <button class="filter" type="button" data-category="First-Time Buyers">First-Time Buyers</button>
      <button class="filter" type="button" data-category="Investment">Investment</button>
      <button class="filter" type="button" data-category="Local Spotlight">Local Spotlight</button>
    </nav>

    <section class="grid" id="blog-grid" aria-live="polite"></section>
    <p class="empty" id="blog-empty">No blog posts are published yet.</p>
    <div class="pagination" id="blog-pagination" role="navigation" aria-label="Blog pages">
      <button class="page-arrow" id="blog-prev" type="button" aria-label="Previous blog page">&#8592;</button>
      <span class="page-status" id="blog-page-status" aria-live="polite"></span>
      <button class="page-arrow" id="blog-next" type="button" aria-label="Next blog page">&#8594;</button>
    </div>
  </main>
  <div id="site-footer"></div>

  <script>
    const categories = [
      "Market Updates",
      "Buyer Tips",
      "Seller Tips",
      "First-Time Buyers",
      "Investment",
      "Local Spotlight",
    ];
    const postsPerPage = 9;
    let posts = [];
    let activeCategory = "ALL";
    let currentPage = 1;

    function slugify(value) {
      return String(value || "")
        .toLowerCase()
        .trim()
        .replace(/&/g, "and")
        .replace(/['"]/g, "")
        .replace(/[^a-z0-9]+/g, "-")
        .replace(/^-+|-+$/g, "");
    }

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function assetPath(value) {
      if (!value) return "";
      if (/^(https?:)?\/\//.test(value) || value.charAt(0) === "/") return value;
      return "/" + value.replace(/^\.?\//, "");
    }

    function postUrl(post) {
      return post.url || post.link || post.permalink || "/blog/" + (post.slug || slugify(post.title));
    }

    function postCategory(post) {
      const value = post.category || (post.categories && post.categories[0]) || "";
      const match = categories.find((category) => slugify(category) === slugify(value));
      return match || value;
    }

    function postDate(post) {
      return new Date(post.date || post.publishDate || 0).getTime();
    }

    function isPostReady(post) {
      if (String(post.publishTiming || "").toLowerCase() !== "future") return true;

      const parts = new Intl.DateTimeFormat("en-US", {
        timeZone: "America/Los_Angeles",
        year: "numeric",
        month: "2-digit",
        day: "2-digit",
        hour: "2-digit",
        hourCycle: "h23",
      }).formatToParts(new Date()).reduce((result, part) => {
        if (part.type !== "literal") result[part.type] = part.value;
        return result;
      }, {});
      const now = Number(`${parts.year}${parts.month}${parts.day}${parts.hour}`);
      const scheduled = Number(`${String(post.scheduleDate || post.date || "").replace(/-/g, "")}${String(post.scheduleHour || "00:00").slice(0, 2)}`);
      return scheduled <= now;
    }

    function isFeatured(post) {
      return post.featured === true || post.isFeatured === true || post.featuredPost === true;
    }

    function renderFeatured() {
      const featured = posts.filter(isFeatured).sort((a, b) => postDate(b) - postDate(a))[0];
      const container = document.getElementById("featured-blog");

      if (!featured) {
        container.classList.remove("is-visible");
        container.innerHTML = "";
        return;
      }

      const image = featured.featuredImage || featured.image || "";
      container.innerHTML = `
        <div>${image ? `<img src="${escapeHtml(assetPath(image))}" alt="${escapeHtml(featured.imageAlt || featured.title || "")}">` : ""}</div>
        <div>
          <p class="eyebrow">Featured Blog</p>
          <h2>${escapeHtml(featured.title || "")}</h2>
          <p class="featured-excerpt">${escapeHtml(featured.excerpt || "")}</p>
          <div class="meta">
            <span>${escapeHtml(postCategory(featured))}</span>
            <span>${escapeHtml(featured.date || featured.publishDate || "")}</span>
          </div>
          <a class="button" href="${escapeHtml(postUrl(featured))}">Read Full Blog</a>
        </div>
      `;
      container.classList.add("is-visible");
    }

    function filteredPosts() {
      const search = slugify(document.getElementById("blog-search").value);
      const sort = document.getElementById("blog-sort").value;

      return posts
        .filter((post) => {
          const categoryMatch = activeCategory === "ALL" || slugify(postCategory(post)) === slugify(activeCategory);
          const searchMatch = !search || slugify([post.title, post.excerpt, postCategory(post)].join(" ")).includes(search);
          return categoryMatch && searchMatch;
        })
        .sort((a, b) => sort === "oldest" ? postDate(a) - postDate(b) : postDate(b) - postDate(a));
    }

    function renderGrid() {
      const grid = document.getElementById("blog-grid");
      const empty = document.getElementById("blog-empty");
      const pagination = document.getElementById("blog-pagination");
      const prevButton = document.getElementById("blog-prev");
      const nextButton = document.getElementById("blog-next");
      const pageStatus = document.getElementById("blog-page-status");
      const filtered = filteredPosts();
      const totalPages = Math.max(1, Math.ceil(filtered.length / postsPerPage));
      currentPage = Math.min(currentPage, totalPages);
      const start = (currentPage - 1) * postsPerPage;
      const visiblePosts = filtered.slice(start, start + postsPerPage);

      grid.innerHTML = visiblePosts.map((post) => {
        const image = post.featuredImage || post.image || "";
        return `
          <article class="card">
            ${image ? `<img src="${escapeHtml(assetPath(image))}" alt="${escapeHtml(post.imageAlt || post.title || "")}">` : ""}
            <div class="card-body">
              <div class="card-category">${escapeHtml(postCategory(post))}</div>
              <h3>${escapeHtml(post.title || "")}</h3>
              <p>${escapeHtml(post.excerpt || "")}</p>
              <a class="button" href="${escapeHtml(postUrl(post))}">Read Full Blog</a>
            </div>
          </article>
        `;
      }).join("");

      empty.classList.toggle("is-visible", filtered.length === 0);
      pagination.classList.toggle("is-visible", totalPages > 1);
      prevButton.disabled = currentPage === 1;
      nextButton.disabled = currentPage === totalPages;
      pageStatus.textContent = `Page ${currentPage} of ${totalPages}`;
    }

    function setCategory(category) {
      activeCategory = category;
      currentPage = 1;
      document.querySelectorAll(".filter").forEach((button) => {
        button.classList.toggle("active", button.dataset.category === category);
      });
      renderGrid();
    }

    document.querySelectorAll(".filter").forEach((button) => {
      button.addEventListener("click", () => setCategory(button.dataset.category));
    });
    document.getElementById("blog-search").addEventListener("input", () => {
      currentPage = 1;
      renderGrid();
    });
    document.getElementById("blog-sort").addEventListener("change", () => {
      currentPage = 1;
      renderGrid();
    });
    document.getElementById("blog-prev").addEventListener("click", () => {
      if (currentPage > 1) {
        currentPage -= 1;
        renderGrid();
      }
    });
    document.getElementById("blog-next").addEventListener("click", () => {
      const totalPages = Math.ceil(filteredPosts().length / postsPerPage);
      if (currentPage < totalPages) {
        currentPage += 1;
        renderGrid();
      }
    });

    fetch("/assets/data/blog-posts.json")
      .then((response) => response.json())
      .then((data) => {
        posts = (Array.isArray(data) ? data : data.posts || []).filter(isPostReady);
        renderFeatured();
        renderGrid();
      })
      .catch(() => {
        document.getElementById("blog-empty").classList.add("is-visible");
      });
  </script>
  <div data-include="/includes/footer.html"></div>
  <script src="/assets/js/includes.js?v=20260618-mobile-nav" defer></script>
  <script src="//code.tidio.co/hhc4vboniih3fkjzb7pz1uksqe22ywym.js" async></script>
  <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
  <script>
  if (window.netlifyIdentity) {
    window.netlifyIdentity.on('init', user => {
      if (!user) {
        window.netlifyIdentity.on('login', () => {
          document.location.href = '/admin/';
        });
      }
    });
  }
</script>
