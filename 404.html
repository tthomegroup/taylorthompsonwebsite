      font-size: clamp(230px, 43vw, 520px);

    h1 em {

    .description {

      margin: 0 auto 38px;
      color: var(--mid);
      font-size: clamp(15px, 1.7vw, 17px);
      font-weight: 300;
      line-height: 1.8;

    .home-button {
      display: inline-flex;
      align-items: center;
      gap: 14px;
      padding: 17px 30px;
      background: var(--tan);
      color: var(--white);
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.18em;
      text-decoration: none;
      text-transform: uppercase;
      transition: background 0.2s ease;

    .home-button:hover,
    .home-button:focus-visible {

    }

    .home-button span {

      letter-spacing: 0.12em;
      text-transform: uppercase;

        gap: 18px;
        padding-top: 22px;
